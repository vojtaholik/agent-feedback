name: Bug Report
description: Report a reproducible problem with Agent Feedback.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Agent Feedback. Never attach a recording that contains private information.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: raycast
    attributes:
      label: Raycast version
    validations:
      required: true
  - type: input
    id: whisper
    attributes:
      label: whisper-cli version
      description: Run `whisper-cli --version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us what you ran, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private paths, transcript text, and captured content before posting.
      render: shell
